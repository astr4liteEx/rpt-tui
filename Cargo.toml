[package]
name = "rpt-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Terminal UI for an rpt report: run rpt, plugins and chains"
license = "MIT"
publish = false

[dependencies]
crossterm = "0.29"
libc = "0.2"
portable-pty = "0.9"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
vt100 = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "2.1"

[dev-dependencies]
insta = "1"
unicode-width = "0.2"
tempfile = "3"

# An unoptimised vt100 starves the UI under a flood of output (run spike):
# build dependencies optimised even in dev.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
