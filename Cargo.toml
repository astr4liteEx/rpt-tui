[package]
name = "rpt-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Terminal UI for an rpt report: run rpt, plugins and chains"
license = "MIT"
publish = false

[dependencies]
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = "1"
tempfile = "3"

# An unoptimised vt100 starves the UI under a flood of output (run spike):
# build dependencies optimised even in dev.
[profile.dev.package."*"]
opt-level = 3
